<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Marketing Maison — Own It. Build It. Scale It.</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="icon" type="image/png" href="../../assets/logos/monogram.png" />
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>

  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="HomeSections.jsx"></script>
  <script type="text/babel" src="Pages.jsx"></script>

  <script type="text/babel">
    function App() {
      const [route, setRoute] = React.useState('home');
      const go = React.useCallback((r) => {
        setRoute(r);
        window.scrollTo({ top: 0, behavior: 'auto' });
      }, []);
      React.useEffect(() => {
        document.title = `Marketing Maison — ${route.charAt(0).toUpperCase()+route.slice(1)}`;
      }, [route]);

      let Page;
      switch (route) {
        case 'services':  Page = PageServices;  break;
        case 'pricing':   Page = PagePricing;   break;
        case 'diagnosis': Page = PageDiagnosis; break;
        case 'dispatch':  Page = PageDispatch;  break;
        default:          Page = PageHome;
      }
      return (
        <div data-screen-label={`Website · ${route}`}>
          <Nav route={route} go={go} />
          <Page go={go} />
          <Footer go={go} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
